name: Statistieken
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Versieinformatie van de app
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # iOS-stijl iconen (bestaand)
  cupertino_icons: ^1.0.8

  # ➜ PDF-export (Methode A) - werkt op Web, mobiel en desktop
  pdf: ^3.10.7
  printing: ^5.13.4
  intl: ^0.20.2
  shared_preferences: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints voor nette code
  flutter_lints: ^6.0.0

flutter:
  # Material icons opnemen
  uses-material-design: true

  assets:
    - assets/fonts/MaterialIcons-Regular.otf

  # Voorbeeld fonts-sectie (optioneel)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700